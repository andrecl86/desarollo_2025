<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Formulario con Validaciones Dinámicas</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>

    <div class="container">
        <h2>Formulario de Registro</h2>

        <form id="formulario" novalidate>

            <label for="nombre">Nombre</label>
            <input type="text" id="nombre">
            <span class="error" id="errorNombre"></span>

            <label for="correo">Correo electrónico</label>
            <input type="email" id="correo">
            <span class="error" id="errorCorreo"></span>

            <label for="password">Contraseña</label>
            <input type="password" id="password">
            <span class="error" id="errorPassword"></span>

            <label for="confirmPassword">Confirmar contraseña</label>
            <input type="password" id="confirmPassword">
            <span class="error" id="errorConfirm"></span>

            <label for="edad">Edad</label>
            <input type="number" id="edad">
            <span class="error" id="errorEdad"></span>

            <div class="buttons">
                <button type="submit" id="btnEnviar" disabled>Enviar</button>
                <button type="reset">Reiniciar</button>
            </div>

        </form>
    </div>

    <script src="script.js"></script>
</body>
</html>
