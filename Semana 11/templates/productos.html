{% extends "base.html" %}

{% block contenido %}
<h2>Lista de Productos</h2>

<table>
    <tr>
        <th>ID</th>
        <th>Nombre</th>
        <th>Precio</th>
        <th>Cantidad</th>
    </tr>

    {% for producto in productos %}
    <tr>
        <td>{{ producto.id }}</td>
        <td>{{ producto.nombre }}</td>
        <td>${{ producto.precio }}</td>
        <td>{{ producto.cantidad }}</td>
    </tr>
    {% endfor %}
</table>

{% endblock %}
