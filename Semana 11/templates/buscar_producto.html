{% extends "base.html" %}

{% block contenido %}

<h2>Buscar Producto</h2>

<form method="POST">
<input type="text" name="nombre" placeholder="Ingrese nombre">
<button type="submit">Buscar</button>
</form>

{% if resultado %}
<h3>Resultado:</h3>
<p>ID: {{ resultado['id'] }}</p>
<p>Nombre: {{ resultado['nombre'] }}</p>
<p>Precio: ${{ resultado['precio'] }}</p>
<p>Cantidad: {{ resultado['cantidad'] }}</p>
{% endif %}

{% endblock %}
